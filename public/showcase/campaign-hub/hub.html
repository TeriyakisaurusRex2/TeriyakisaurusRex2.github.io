<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Saltmere Campaign Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: top nav; 70/30 split, visual stage left and detail rail right; stacks on phones */
:root{
  --bg:#10141a; --panel:#171d25; --raise:#1f2731; --line:#2c3643; --fg:#e7e2d7; --muted:#95a0aa;
  --brass:#cfa955; --verd:#5fa59a; --good:#74c27a; --warn:#e3b04b; --crit:#e0605a;
  --sea:#15303a; --sea2:#1b3c48; --land:#38483a; --land2:#465843; --ink:#0b0f14;
  --display:"Pirata One", Georgia, serif;
  --body:"Alegreya Sans", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 14px}

/* nav */
.nav{display:flex;align-items:center;gap:20px;border-bottom:1px solid var(--line);padding-block:10px;min-width:0}
.brand{display:flex;flex-direction:column;line-height:1.05;flex:none}
.brand-mark{font-family:var(--display);font-size:28px;color:var(--brass);letter-spacing:.02em}
.brand-sub{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.tabs{display:flex;gap:2px;overflow-x:auto;min-width:0;flex:1;scrollbar-width:none}
.tabs a{color:var(--muted);text-decoration:none;padding:9px 12px;border-radius:6px;white-space:nowrap;font-weight:500;border-bottom:2px solid transparent;border-radius:6px 6px 0 0}
.tabs a:hover{color:var(--fg);background:var(--panel)}
.tabs a.on{color:var(--brass);border-bottom-color:var(--brass)}
.whoami{flex:none;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.whoami b{color:var(--fg)}
.dot{width:8px;height:8px;border-radius:50%;background:#b07acf;box-shadow:0 0 0 3px #b07acf33}

/* main split */
.main{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,3fr);gap:12px;min-height:0}
.stage{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--ink);min-height:0}
.rail{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 18px 22px;min-width:0;display:flex;flex-direction:column;gap:16px}
.stage-tag{position:absolute;top:12px;left:14px;z-index:3;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:#0b0f14cc;padding:4px 8px;border-radius:4px;pointer-events:none}
.placeholder-note{position:absolute;bottom:10px;left:14px;z-index:3;font-size:12px;color:var(--muted);font-style:italic;pointer-events:none}

/* rail typography */
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rail h2{font-family:var(--display);font-weight:400;font-size:32px;line-height:1;margin:4px 0 0;text-wrap:balance;color:var(--fg)}
.rail h3{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);margin:0 0 8px;font-weight:500}
.rail p{margin:0;max-width:65ch}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--raise)}
.chip.good{color:var(--good);border-color:#74c27a55}.chip.warn{color:var(--warn);border-color:#e3b04b55}.chip.crit{color:var(--crit);border-color:#e0605a55}
.chip.brass{color:var(--brass);border-color:#cfa95566}.chip.verd{color:var(--verd);border-color:#5fa59a66}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--raise);border-radius:8px;padding:8px 10px}
.stat .k{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.stat .v{font-family:var(--mono);font-size:19px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--raise);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--good)}
.hpline{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:5px;font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.list li{display:flex;gap:10px;align-items:baseline;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .r{font-family:var(--mono);font-size:13px;color:var(--brass);white-space:nowrap;font-variant-numeric:tabular-nums}
.btn{background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--brass)}
.btn.primary{background:var(--brass);color:#16120a;border-color:var(--brass)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.link{background:none;border:0;padding:0;color:var(--verd);text-decoration:underline;text-underline-offset:3px}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.check input{accent-color:var(--brass);margin-top:3px}
.check.done span{color:var(--muted);text-decoration:line-through}

/* party stage */
.fig-wrap{position:absolute;inset:0;display:flex;justify-content:center;align-items:flex-end;padding-bottom:96px}
.fig{height:92%;max-width:100%}
.hero-name{position:absolute;top:40px;left:16px;z-index:2;max-width:55%}
.hero-name .n{font-family:var(--display);font-size:clamp(34px,5vw,58px);line-height:.95;text-wrap:balance}
.hero-name .c{color:var(--muted);margin-top:6px}
.roster{position:absolute;left:12px;right:12px;bottom:12px;z-index:3;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rcard{display:flex;gap:10px;align-items:center;text-align:left;background:#171d25e6;border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0}
.rcard.on{border-color:var(--brass)}
.rcard .av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-size:17px;color:#0b0f14}
.rcard .t{min-width:0}
.rcard .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.rcard .t small{color:var(--muted);font-size:12px}
.rcard .bar{display:block;height:4px;margin-top:4px}

/* sheet stage */
.sheet-stage{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:12px;padding:44px 16px 16px}
.slots{display:flex;flex-direction:column;justify-content:center;gap:10px}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.slot .k{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.slot .v{font-size:14px;overflow-wrap:anywhere}
.slot.empty .v{color:var(--muted);font-style:italic}
.sheet-fig{display:flex;justify-content:center;align-items:center;min-height:0}
.sheet-fig .fig{height:100%}
.ribbon{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.ribbon .stat{background:var(--panel);border:1px solid var(--line);text-align:center}
.hpctl{display:flex;align-items:center;justify-content:center;gap:6px}
.hpctl button{width:24px;height:24px;border-radius:5px;border:1px solid var(--line);background:var(--raise);line-height:1;padding:0}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.subtabs button{background:none;border:0;padding:8px 10px;color:var(--muted);border-bottom:2px solid transparent;font-weight:500}
.subtabs button.on{color:var(--brass);border-bottom-color:var(--brass)}
.abil{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.abil .stat{text-align:center}
.abil .m{font-family:var(--mono);font-size:22px}
.abil .s{font-family:var(--mono);font-size:11px;color:var(--muted)}
.sk{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:8px;align-items:center;padding:4px 0;font-size:14px;border-bottom:1px solid var(--line)}
.sk .p{width:9px;height:9px;border-radius:50%;border:1px solid var(--muted)}
.sk .p.on{background:var(--brass);border-color:var(--brass)}
.sk .p.ex{background:var(--brass);border-color:var(--brass);box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--brass)}
.sk .a{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:6px}
.sk .b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pips{display:flex;gap:6px}
.pip{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--brass);background:var(--brass)}
.pip.used{background:transparent;border-color:var(--line)}

/* quests */
.board{position:absolute;inset:0;overflow:auto;padding:48px 16px 16px;
  background:radial-gradient(circle at 30% 20%,#2a2219 0,#1a1611 70%)}
.qfilter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.qfilter button{background:#0b0f14aa;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--muted)}
.qfilter button.on{color:var(--brass);border-color:var(--brass)}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:22px 18px}
.note{position:relative;text-align:left;background:#e4dccb;color:#2a241a;border:0;border-radius:2px;padding:22px 16px 16px;min-height:150px;
  box-shadow:0 8px 18px #0008;transform:rotate(var(--r,0deg));transition:transform .15s}
.note:hover{transform:rotate(0) translateY(-3px)}
.note.on{outline:3px solid var(--brass);outline-offset:3px}
.note::before{content:"";position:absolute;top:8px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--crit);box-shadow:0 2px 3px #0007}
.note h4{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.05;margin:4px 0 8px;text-wrap:balance}
.note p{margin:0;font-size:13.5px;line-height:1.35}
.stamp{position:absolute;right:10px;bottom:10px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1.5px solid currentColor;padding:2px 6px;transform:rotate(-6deg)}
.stamp.active{color:#7a5a12}.stamp.rumour{color:#3e5d74}.stamp.completed{color:#3f6b3f}
.note.completed{opacity:.7}

/* maps */
.map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.map:active{cursor:grabbing}
.pin{cursor:pointer}
.pin .ring{fill:none;stroke:var(--brass);stroke-width:2;opacity:0}
.pin.on .ring{opacity:1}
.pin:hover .dotc{filter:brightness(1.25)}
.pin text{font-family:var(--body);font-weight:700;paint-order:stroke;stroke:#0b0f14;stroke-width:4px;stroke-linejoin:round;fill:var(--fg)}
.mapctl{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;z-index:3;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:34px;height:34px;border-radius:7px;background:#171d25ee;border:1px solid var(--line);font-family:var(--mono);font-size:16px}
.legend{position:absolute;left:14px;bottom:12px;z-index:3;display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);background:#0b0f14cc;padding:6px 10px;border-radius:6px;max-width:calc(100% - 80px)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* merchants */
.shop{position:absolute;inset:0;overflow:auto;padding:46px 16px 16px;display:flex;flex-direction:column;gap:16px}
.mtabs{display:flex;gap:8px;flex-wrap:wrap}
.mtabs button{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px 8px 8px;text-align:left}
.mtabs button.on{border-color:var(--brass)}
.mav{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:#0b0f14;flex:none}
.mtabs small{display:block;color:var(--muted);font-size:12px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:150px}
.item.on{border-color:var(--brass);background:var(--raise)}
.item svg{width:44px;height:44px}
.item b{font-weight:500;font-size:14px;line-height:1.2}
.item .pr{margin-top:auto;font-family:var(--mono);font-size:13px;color:var(--brass)}
.r-common{color:var(--muted)}.r-uncommon{color:var(--good)}.r-rare{color:#6aa3e6}

/* combat */
.combat-svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.init{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.init li button{width:100%;display:grid;grid-template-columns:30px 22px minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--raise);border:1px solid transparent;border-radius:7px;padding:6px 8px;text-align:left}
.init li button.cur{border-color:var(--brass)}
.init li button.sel{background:#2a3340}
.init li button.down{opacity:.45}
.init .iv{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:center}
.init .tk{width:18px;height:18px;border-radius:50%}
.init .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.turnbanner{background:var(--raise);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.turnbanner.you{background:#2b2617;border:1px solid #cfa95566}
.small{font-size:13px;color:var(--muted)}

@media (max-width:860px){
  .app{height:auto;min-height:100%}
  .main{grid-template-columns:minmax(0,1fr)}
  .stage{height:62vh;min-height:380px}
  .rail{overflow:visible}
  .whoami{display:none}
  .roster{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fig-wrap{padding-bottom:132px}
  .hero-name{max-width:70%}
  .ribbon{grid-template-columns:repeat(3,minmax(0,1fr))}
  .sheet-stage{grid-template-columns:minmax(0,1fr) minmax(0,1fr);overflow:auto}
  .sheet-fig{display:none}
}
@media (max-width:480px){
  .nav{flex-wrap:wrap;gap:6px 16px}
  .tabs{flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="nav">
    <div class="brand"><span class="brand-mark">Saltmere</span><span class="brand-sub">Gullwater Coast · Session 14</span></div>
    <nav class="tabs" aria-label="Sections">
      <a href="#party" data-view="party">Party</a>
      <a href="#sheet" data-view="sheet">My Sheet</a>
      <a href="#quests" data-view="quests">Quests</a>
      <a href="#locations" data-view="locations">Locations</a>
      <a href="#services" data-view="services">Services</a>
      <a href="#merchants" data-view="merchants">Merchants</a>
      <a href="#combat" data-view="combat">Combat</a>
    </nav>
    <div class="whoami"><span class="dot"></span>Playing as <b>Ysolde</b></div>
  </header>
  <main class="main">
    <section class="stage" id="stage" aria-label="Main view"></section>
    <aside class="rail" id="rail" aria-label="Details"></aside>
  </main>
</div>

<script>
/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem('saltmere:'+k);return v?JSON.parse(v):d}catch(e){return d}},
             set(k,v){try{localStorage.setItem('saltmere:'+k,JSON.stringify(v))}catch(e){}}};
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const t=amt<0?0:255,p=Math.abs(amt);
  r=Math.round(r+(t-r)*p);g=Math.round(g+(t-g)*p);b=Math.round(b+(t-b)*p);return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
const mod=s=>Math.floor((s-10)/2), sgn=n=>(n>=0?'+':'')+n;
const pct=(a,b)=>Math.max(0,Math.min(100,a/b*100));
const hpColor=p=>p>50?'var(--good)':p>25?'var(--warn)':'var(--crit)';
let uid=0;

/* ---------- placeholder figure art ---------- */
function figure(c,prop){
  const u=++uid, dk=shade(c,-.55), md=shade(c,-.3);
  const props={
    sword:`<path d="M213 305 L221 118 L229 305Z" fill="#cfd6dc"/><rect x="204" y="300" width="34" height="7" rx="2" fill="#cfa955"/><rect x="216" y="306" width="10" height="26" fill="#5a3e22"/>`,
    lute:`<ellipse cx="96" cy="318" rx="30" ry="38" fill="#7a4e28"/><circle cx="96" cy="316" r="8" fill="#2a1a0c"/><rect x="91" y="210" width="10" height="80" fill="#5a3a1c" transform="rotate(-14 96 290)"/>`,
    daggers:`<path d="M84 300 L80 368 L90 300Z" fill="#cfd6dc"/><rect x="76" y="294" width="16" height="6" fill="#cfa955"/><path d="M216 300 L220 368 L210 300Z" fill="#cfd6dc"/><rect x="208" y="294" width="16" height="6" fill="#cfa955"/>`,
    mace:`<circle cx="84" cy="262" r="44" fill="${shade(c,-.15)}" stroke="#cfa955" stroke-width="4"/><path d="M84 232 L84 292 M54 262 L114 262" stroke="#cfa955" stroke-width="5"/><rect x="211" y="230" width="8" height="80" fill="#5a3e22"/><circle cx="215" cy="226" r="15" fill="#9aa3ab"/>`
  };
  return `<svg class="fig" viewBox="0 0 300 520" aria-hidden="true">
  <defs><radialGradient id="ga${u}" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="${c}" stop-opacity=".32"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>
  <linearGradient id="gb${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="${dk}"/></linearGradient></defs>
  <ellipse cx="150" cy="260" rx="150" ry="250" fill="url(#ga${u})"/>
  <ellipse cx="150" cy="500" rx="82" ry="12" fill="#000" opacity=".5"/>
  <path d="M128 360 L118 494 L140 494 L149 382Z M172 360 L182 494 L160 494 L151 382Z" fill="${shade(c,-.65)}"/>
  <path d="M98 172 C78 204 72 254 78 304 L94 304 C94 262 100 222 114 192Z M202 172 C222 204 228 254 222 304 L206 304 C206 262 200 222 186 192Z" fill="${md}"/>
  <path d="M150 128 C112 128 98 150 92 190 L78 384 C112 400 188 400 222 384 L208 190 C202 150 188 128 150 128Z" fill="url(#gb${u})"/>
  <rect x="96" y="252" width="108" height="9" fill="#cfa955" opacity=".85"/>
  <path d="M110 116 C108 62 192 62 190 116 L182 146 L118 146Z" fill="${shade(c,-.2)}"/>
  <ellipse cx="150" cy="108" rx="20" ry="25" fill="#0b0e12" opacity=".75"/>
  ${props[prop]||''}
  </svg>`;
}

/* ---------- sample campaign data ---------- */
const PARTY=[
 {id:'ysolde',name:'Ysolde Fen',you:true,player:'J',race:'Half-elf',cls:'Bard',sub:'College of Lore',lvl:5,color:'#b07acf',prop:'lute',max:38,ac:14,speed:30,pp:14,

/* ---------- pan & zoom for svg maps ---------- */
function panZoom(svg,W,H){
  let vb={x:0,y:0,w:W,h:H},down=null,dragged=false;
  const apply=()=>svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const clamp=()=>{vb.w=Math.max(W/4,Math.min(W,vb.w));vb.h=vb.w*H/W;vb.x=Math.max(0,Math.min(W-vb.w,vb.x));vb.y=Math.max(0,Math.min(H-vb.h,vb.y))};
  const zoomAt=(f,px,py)=>{const nw=Math.max(W/4,Math.min(W,vb.w*f)),k=nw/vb.w;vb.x=px-(px-vb.x)*k;vb.y=py-(py-vb.y)*k;vb.w=nw;clamp();apply()};
  const toSvg=e=>{const r=svg.getBoundingClientRect();const s=Math.max(r.width/vb.w,r.height/vb.h);
    return[vb.x+(e.clientX-r.left-(r.width-vb.w*s)/2)/s,vb.y+(e.clientY-r.top-(r.height-vb.h*s)/2)/s,s]};
  svg.addEventListener('wheel',e=>{e.preventDefault();const[p,q]=toSvg(e);zoomAt(e.deltaY>0?1.15:1/1.15,p,q)},{passive:false});
  svg.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y,id:e.pointerId};dragged=false});
  svg.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;
    if(!dragged&&Math.hypot(dx,dy)>5){dragged=true;try{svg.setPointerCapture(down.id)}catch(_){}}
    if(dragged){const s=toSvg(e)[2];vb.x=down.vx-dx/s;vb.y=down.vy-dy/s;clamp();apply()}});
  const up=()=>{down=null};svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
  svg.addEventListener('click',e=>{if(dragged){e.stopPropagation();e.preventDefault();dragged=false}},true);
  apply();
  return{zoom:f=>zoomAt(f,vb.x+vb.w/2,vb.y+vb.h/2),reset:()=>{vb={x:0,y:0,w:W,h:H};apply()}};
}

function blob(cx,cy,r,seed,n=72,amp=.28){
  const R=mulberry(seed),h=[1,2,3,5,8].map(k=>({k,a:(R()*2-1)*amp/Math.sqrt(k),p:R()*6.283})),pts=[];
  for(let i=0;i<n;i++){const t=i/n*6.283;let m=1;h.forEach(o=>m+=o.a*Math.sin(o.k*t+o.p));pts.push([cx+Math.cos(t)*r*m*1.25,cy+Math.sin(t)*r*m*.85])}
  const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];let s=mid(pts[n-1],pts[0]),d=`M${s[0].toFixed(1)} ${s[1].toFixed(1)}`;
  for(let i=0;i<n;i++){const p=pts[i],m=mid(p,pts[(i+1)%n]);d+=`Q${p[0].toFixed(1)} ${p[1].toFixed(1)} ${m[0].toFixed(1)} ${m[1].toFixed(1)}`}
  return{d:d+'Z',pts,c:[cx,cy]};
}

/* ---------- combat ---------- */
const MAP=["################","#......#.......#","#......#..~~...#","#..............#","#......#...O...#","###.####.......#","#..............#","#....~~........#","#....~~...#....#","#.........#....#","#..............#","################"];
const COLS=16,ROWS=12,CS=40;
const C={round:2,turn:0,sel:'ysolde',moveLeft:30,dashed:false,hover:null,
 tokens:[
  {id:'kett',name:'Kett',x:3,y:9,init:19,hp:22,max:33,ac:15,speed:30,pc:true,c:'#5fa59a',cond:['Hidden']},
  {id:'captain',name:'Bandit Captain',x:12,y:2,init:16,hp:65,max:65,ac:15,speed:30,c:'#a8443f',cond:[]},
  {id:'ysolde',name:'Ysolde Fen',x:2,y:8,init:14,hp:31,max:38,ac:14,speed:30,pc:true,you:true,c:'#b07acf',cond:[]},
  {id:'wolf',name:'Wolf',x:9,y:3,init:13,hp:6,max:11,ac:13,speed:40,c:'#8a6a4a',cond:['Prone']},
  {id:'brannoc',name:'Brannoc Ashvale',x:4,y:7,init:11,hp:44,max:49,ac:18,speed:30,pc:true,c:'#c9714f',cond:[]},
  {id:'b1',name:'Bandit',x:12,y:4,init:9,hp:4,max:11,ac:12,speed:30,c:'#a8443f',cond:['Frightened']},
  {id:'b2',name:'Bandit',x:13,y:6,init:9,hp:11,max:11,ac:12,speed:30,c:'#a8443f',cond:[]},
  {id:'oriel',name:'Oriel Thorne',x:2,y:6,init:6,hp:40,max:43,ac:18,speed:25,pc:true,c:'#d8b65a',cond:[]},
 ]};
C.turn=C.tokens.findIndex(t=>t.id==='ysolde');
const tok=id=>C.tokens.find(t=>t.id===id), active=()=>C.tokens[C.turn];
const wall=(x,y)=>{const c=MAP[y]?.[x];return!c||c==='#'||c==='O'};
const enemyState=t=>t.hp<=0?['Down','crit']:t.hp===t.max?['Unhurt','good']:t.hp>t.max/2?['Wounded','warn']:['Bloodied','crit'];
function reach(t){
  const dist={},prev={},k=(x,y)=>x+','+y,occ=new Set(C.tokens.filter(o=>o!==t&&o.hp>0).map(o=>k(o.x,o.y)));
  dist[k(t.x,t.y)]=0;const q=[[0,t.x,t.y]];
  while(q.length){q.sort((a,b)=>a[0]-b[0]);const[d,x,y]=q.shift();if(d>dist[k(x,y)])continue;
    for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){if(!dx&&!dy)continue;const nx=x+dx,ny=y+dy;
      if(wall(nx,ny)||occ.has(k(nx,ny)))continue;if(dx&&dy&&(wall(x+dx,y)||wall(x,y+dy)))continue;
      const nd=d+(MAP[ny][nx]==='~'?10:5);if(nd>C.moveLeft)continue;
      if(dist[k(nx,ny)]===undefined||nd<dist[k(nx,ny)]){dist[k(nx,ny)]=nd;prev[k(nx,ny)]=k(x,y);q.push([nd,nx,ny])}}}
  return{dist,prev};
}
let RCH=null;
function combatSVG(){
  const a=active(),showReach=C.sel===a.id&&a.hp>0;RCH=showReach?reach(a):null;
  let floor='';for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const c=MAP[y][x];
    if(c==='#')floor+=`<rect x="${x*CS}" y="${y*CS}" width="${CS}" height="${CS}" fill="#232a33"/>`;
    else if(c==='O')floor+=`<rect x="${x*CS}" y="${y*CS}" width="${CS}" height="${CS}" fill="#3b4048"/><circle cx="${x*CS+20}" cy="${y*CS+20}" r="15" fill="#59606a" stroke="#22272e" stroke-width="3"/>`;
    else floor+=`<rect x="${x*CS}" y="${y*CS}" width="${CS}" height="${CS}" fill="${(x+y)%2?'#4a4237':'#463e34'}"/>${c==='~'?`<g fill="#6b6255"><circle cx="${x*CS+11}" cy="${y*CS+14}" r="4"/><circle cx="${x*CS+26}" cy="${y*CS+24}" r="5"/><circle cx="${x*CS+16}" cy="${y*CS+31}" r="3"/></g>`:''}`}
  let reachL='';if(RCH)for(const key in RCH.dist){if(!RCH.dist[key])continue;const[x,y]=key.split(',').map(Number);reachL+=`<rect x="${x*CS+1}" y="${y*CS+1}" width="${CS-2}" height="${CS-2}" fill="#cfa955" opacity=".16"/>`}
  const toks=C.tokens.map(t=>{const isA=t===a,isS=t.id===C.sel,cx=t.x*CS+20,cy=t.y*CS+20;
    return`<g opacity="${t.hp>0?1:.35}">${isA?`<circle cx="${cx}" cy="${cy}" r="19" fill="none" stroke="#cfa955" stroke-width="3"/>`:''}
    ${isS&&!isA?`<circle cx="${cx}" cy="${cy}" r="19" fill="none" stroke="#e7e2d7" stroke-width="2" stroke-dasharray="4 3"/>`:''}
    <circle cx="${cx}" cy="${cy}" r="15" fill="${t.c}" stroke="${t.pc?'#0b0f14':'#2a0d0b'}" stroke-width="2.5"/>
    <text x="${cx}" y="${cy+5}" text-anchor="middle" font-family="Pirata One, Georgia, serif" font-size="16" fill="#0b0f14">${t.name[0]}${t.id==='b1'?'1':t.id==='b2'?'2':''}</text>
    ${t.cond.includes('Prone')?`<text x="${cx+12}" y="${cy-10}" font-size="11" fill="#e3b04b" font-family="IBM Plex Mono, monospace">P</text>`:''}</g>`}).join('');
  let grid='';for(let x=0;x<=COLS;x++)grid+=`M${x*CS} 0V${ROWS*CS}`;for(let y=0;y<=ROWS;y++)grid+=`M0 ${y*CS}H${COLS*CS}`;
  return`<rect width="${COLS*CS}" height="${ROWS*CS}" fill="#0b0f14"/>${floor}<path d="${grid}" stroke="#0b0f14" stroke-opacity=".45" stroke-width="1"/>${reachL}<g id="pathL"></g>${toks}`;
}
function drawPath(){
  const g=$('#pathL');if(!g)return;g.innerHTML='';const h=C.hover;if(!RCH||!h)return;const key=h.join(',');if(RCH.dist[key]===undefined||!RCH.dist[key])return;
  const pts=[];let cur=key;while(cur){const[x,y]=cur.split(',').map(Number);pts.unshift(`${x*CS+20},${y*CS+20}`);cur=RCH.prev[cur]}
  const[hx,hy]=h;g.innerHTML=`<polyline points="${pts.join(' ')}" fill="none" stroke="#cfa955" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round"/>
  <rect x="${hx*CS+2}" y="${hy*CS+2}" width="${CS-4}" height="${CS-4}" fill="none" stroke="#cfa955" stroke-width="2"/>
  <g transform="translate(${hx*CS+20} ${hy*CS-6})"><rect x="-24" y="-12" width="48" height="18" rx="4" fill="#0b0f14" opacity=".9"/><text text-anchor="middle" y="2" font-size="12" fill="#cfa955" font-family="IBM Plex Mono, monospace">${RCH.dist[key]} ft</text></g>`;
}
V.combat={stage(){return`<div class="stage-tag">Combat · Smugglers' cellar</div><svg class="combat-svg" id="cmap" viewBox="0 0 ${COLS*CS} ${ROWS*CS}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Combat grid, 5 foot squares">${combatSVG()}</svg>
  <div class="legend"><span><i style="background:#cfa955;opacity:.6"></i>Can reach</span><span><i style="background:#6b6255"></i>Difficult terrain</span><span>1 square = 5 ft</span></div>`},
 mount(){
  const svg=$('#cmap');
  const cellOf=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());return[Math.floor(q.x/CS),Math.floor(q.y/CS)]};
  svg.addEventListener('pointermove',e=>{const c=cellOf(e);if(!C.hover||c[0]!==C.hover[0]||c[1]!==C.hover[1]){C.hover=c;drawPath()}});
  svg.addEventListener('pointerleave',()=>{C.hover=null;drawPath()});
  svg.addEventListener('click',e=>{const[x,y]=cellOf(e),t=C.tokens.find(o=>o.x===x&&o.y===y);
    if(t){C.sel=t.id;return refreshCombat()}
    const key=x+','+y;if(RCH&&RCH.dist[key]){const a=active();C.moveLeft-=RCH.dist[key];a.x=x;a.y=y;if(a.cond.includes('Hidden'))a.cond=a.cond.filter(c=>c!=='Hidden');refreshCombat()}});
 },
 rail(){
  const a=active(),s=tok(C.sel),you=a.you,maxMove=a.speed*(C.dashed?2:1);
  const info=s.pc?`<div class="hpline"><span>Hit points</span><span>${s.hp} / ${s.max}</span></div><div class="bar"><i style="width:${pct(s.hp,s.max)}%;background:${hpColor(pct(s.hp,s.max))}"></i></div>`
    :(()=>{const[l,c]=enemyState(s);return`<div class="chips"><span class="chip ${c}">${l}</span></div><p class="small" style="margin-top:6px">Exact enemy hit points are hidden from players.</p>`})();
  return`<div><div class="eyebrow">Round ${C.round}</div><h2>${you?'Your turn':a.name+'\'s turn'}</h2></div>
  <div class="turnbanner ${you?'you':''}">
    <div class="hpline"><span>Movement left</span><span>${C.moveLeft} / ${maxMove} ft</span></div>
    <div class="bar"><i style="width:${pct(C.moveLeft,maxMove)}%;background:var(--brass)"></i></div>
    <div class="small">${C.sel===a.id?'Tap a highlighted square to move. Diagonals cost 5 ft, rubble costs double.':'Select '+a.name+' to see where they can move.'}</div>
    <div class="btnrow"><button class="btn" data-act="dash" ${C.dashed?'disabled':''}>Dash</button><button class="btn primary" data-act="endturn">End turn</button></div>
  </div>
  <div><h3>Initiative</h3><ul class="init">${C.tokens.map((t,i)=>`<li><button class="${i===C.turn?'cur':''} ${t.id===C.sel?'sel':''} ${t.hp<=0?'down':''}" data-act="csel" data-id="${t.id}"><span class="iv">${t.init}</span><span class="tk" style="background:${t.c}"></span><span class="nm">${t.name}${t.id==='b1'?' 1':t.id==='b2'?' 2':''}${t.you?' (you)':''}</span>${t.pc?`<span class="small">${t.hp}/${t.max}</span>`:`<span class="chip ${enemyState(t)[1]}">${enemyState(t)[0]}</span>`}</button></li>`).join('')}</ul></div>
  <div><h3>Selected · ${s.name}</h3>${info}
   <div class="stats" style="margin-top:10px"><div class="stat"><div class="k">AC</div><div class="v">${s.pc?s.ac:'?'}</div></div><div class="stat"><div class="k">Speed</div><div class="v">${s.speed} ft</div></div><div class="stat"><div class="k">Init</div><div class="v">${s.init}</div></div></div>
   <div class="chips" style="margin-top:10px">${s.cond.length?s.cond.map(c=>`<span class="chip warn">${c}</span>`).join(''):'<span class="chip">No conditions</span>'}</div></div>
  <p class="small">Mock-up: any active token can move so you can try the grid. Later the DM would control enemy turns.</p>`;
 }};
function refreshCombat(){const svg=$('#cmap');if(svg){svg.innerHTML=combatSVG();drawPath()}$('#rail').innerHTML=V.combat.rail()}

/* ---------- render & routing ---------- */
function markPins(){const id=S.view==='locations'?S.loc:S.svc;document.querySelectorAll('.pin').forEach(p=>p.classList.toggle('on',p.dataset.pin===id))}
function render(){
  document.querySelectorAll('.tabs a').forEach(a=>a.classList.toggle('on',a.dataset.view===S.view));
  const v=V[S.view];$('#stage').innerHTML=v.stage();$('#rail').innerHTML=v.rail();PZ=null;v.mount&&v.mount();
}
const renderRail=()=>{$('#rail').innerHTML=V[S.view].rail()};
function route(){const h=location.hash.slice(1);S.view=V[h]?h:'party';render()}
window.addEventListener('hashchange',route);

document.addEventListener('click',e=>{
  const pin=e.target.closest('.pin');
  if(pin){if(S.view==='locations')S.loc=pin.dataset.pin;else S.svc=pin.dataset.pin;markPins();renderRail();return}
  const el=e.target.closest('[data-act]');if(!el)return;const d=el.dataset,act=d.act;
  switch(act){
    case'party':S.party=d.id;render();break;
    case'goto':location.hash='#'+d.view;break;
    case'stab':S.sheetTab=d.id;renderRail();break;
    case'hp':S.hp=Math.max(0,Math.min(PARTY[0].max,S.hp+ +d.d));store.set('hp',S.hp);C.tokens.find(t=>t.id==='ysolde').hp=S.hp;render();break;
    case'insp':S.insp=Math.max(0,Math.min(4,S.insp+ +d.d));store.set('insp',S.insp);render();break;
    case'slot':{const lv=d.lv,i=+d.i;S.used[lv]=i<S.used[lv]?i:i+1;store.set('used',S.used);renderRail();break}
    case'rest':S.hp=PARTY[0].max;S.used={1:0,2:0,3:0};S.insp=4;store.set('hp',S.hp);store.set('used',S.used);store.set('insp',4);C.tokens.find(t=>t.id==='ysolde').hp=S.hp;render();break;
    case'qf':S.qFilter=d.id;render();break;
    case'quest':S.quest=d.id;$('#stage').querySelectorAll('.note').forEach(n=>n.classList.toggle('on',n.dataset.id===d.id));renderRail();break;
    case'gotoloc':S.loc=d.id;location.hash='#locations';break;
    case'gotoquest':S.quest=d.id;S.qFilter='all';location.hash='#quests';break;
    case'svc':S.svc=d.id;markPins();renderRail();break;
    case'merch':S.merch=d.id;S.item=0;render();break;
    case'item':S.item=+d.i;$('#stage').querySelectorAll('.item').forEach((n,i)=>n.classList.toggle('on',i===S.item));renderRail();break;
    case'req':S.req[S.merch+':'+S.item]=1;store.set('req',S.req);renderRail();break;
    case'unreq':delete S.req[S.merch+':'+S.item];store.set('req',S.req);renderRail();break;
    case'zin':PZ&&PZ.zoom(1/1.3);break;case'zout':PZ&&PZ.zoom(1.3);break;case'zreset':PZ&&PZ.reset();break;
    case'csel':C.sel=d.id;refreshCombat();break;
    case'dash':if(!C.dashed){C.dashed=true;C.moveLeft+=active().speed;refreshCombat()}break;
    case'endturn':{let n=C.turn;do{n=(n+1)%C.tokens.length;if(n===0)C.round++}while(C.tokens[n].hp<=0&&n!==C.turn);
      C.turn=n;C.sel=active().id;C.moveLeft=active().speed;C.dashed=false;refreshCombat();break}
  }
});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.act!=='obj')return;
  const q=el.dataset.q,i=+el.dataset.i,arr=S.checks[q]||[];S.checks[q]=el.checked?[...new Set([...arr,i])]:arr.filter(x=>x!==i);store.set('checks',S.checks);renderRail()});

C.tokens.find(t=>t.id==='ysolde').hp=S.hp;
route();
</script>

</body></html>
